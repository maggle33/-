<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="陈裕和 - 个人简历 | 浙江工业大学 | 学生领袖与活动策划">
<title>陈裕和 · 个人简历</title>
<style>
  /* ========== CSS 变量 / 主题 ========== */
  :root{
    --primary:#4f46e5;
    --primary-soft:#eef2ff;
    --primary-grad:linear-gradient(135deg,#6366f1 0%,#4f46e5 50%,#7c3aed 100%);
    --accent:#f59e0b;
    --accent-soft:#fef3c7;
    --bg:#f8fafc;
    --bg-2:#ffffff;
    --surface:#ffffff;
    --surface-2:#f1f5f9;
    --text:#0f172a;
    --text-2:#475569;
    --text-3:#94a3b8;
    --border:#e2e8f0;
    --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
    --shadow-lg:0 10px 30px -8px rgba(79,70,229,.15),0 4px 12px rgba(15,23,42,.06);
    --shadow-hover:0 20px 40px -12px rgba(79,70,229,.22),0 8px 16px rgba(15,23,42,.08);
    --radius:14px;
    --radius-sm:10px;
    --radius-lg:22px;
    --maxw:1080px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono","Fira Code","Cascadia Code",Consolas,"Courier New",monospace;
    --t:200ms cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"]{
    --primary:#818cf8;
    --primary-soft:#1e1b4b;
    --primary-grad:linear-gradient(135deg,#818cf8 0%,#6366f1 50%,#a78bfa 100%);
    --accent:#fbbf24;
    --accent-soft:#422006;
    --bg:#0b0f1a;
    --bg-2:#0f1420;
    --surface:#131a28;
    --surface-2:#1a2236;
    --text:#f1f5f9;
    --text-2:#cbd5e1;
    --text-3:#64748b;
    --border:#1e293b;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
    --shadow-lg:0 10px 30px -8px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.3);
    --shadow-hover:0 20px 40px -12px rgba(129,140,248,.25),0 8px 16px rgba(0,0,0,.4);
  }

  /* ========== 重置 / 基础 ========== */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    font-size:16px;
    overflow-x:hidden;
    transition:background var(--t),color var(--t);
    -webkit-font-smoothing:antialiased;
  }
  /* 背景纹理装饰 */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%,rgba(99,102,241,.08),transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%,rgba(245,158,11,.06),transparent);
  }
  [data-theme="dark"] body::before{
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%,rgba(129,140,248,.10),transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%,rgba(251,191,36,.05),transparent);
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ul{list-style:none}

  /* ========== 容器 ========== */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  section{padding:72px 0;scroll-margin-top:84px}
  .section-head{display:flex;align-items:center;gap:14px;margin-bottom:36px}
  .section-head .idx{
    font-family:var(--mono);font-size:13px;font-weight:600;
    color:var(--primary);background:var(--primary-soft);
    padding:4px 10px;border-radius:8px;letter-spacing:.5px;
  }
  .section-head h2{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .section-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

  /* ========== 导航栏 ========== */
  nav.topbar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--border);
    transition:background var(--t),border-color var(--t);
  }
  nav.topbar .inner{
    max-width:var(--maxw);margin:0 auto;padding:0 24px;
    height:60px;display:flex;align-items:center;gap:20px;
  }
  .brand{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary-grad);box-shadow:0 0 12px var(--primary)}
  .nav-links{display:flex;gap:4px;margin-left:auto;align-items:center}
  .nav-links a{
    padding:7px 13px;border-radius:8px;font-size:14px;font-weight:500;
    color:var(--text-2);transition:all var(--t);white-space:nowrap;
  }
  .nav-links a:hover{color:var(--primary);background:var(--primary-soft)}
  .nav-actions{display:flex;gap:8px;align-items:center;margin-left:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
    transition:all var(--t);
  }
  .icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px)}
  .icon-btn svg{width:18px;height:18px}
  .lang-btn{font-size:12px;font-weight:700;padding:0 10px;width:auto;min-width:38px}
  .menu-toggle{display:none}

  /* ========== Hero ========== */
  .hero{padding:120px 0 64px;position:relative}
  .hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center}
  .hero-tag{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;border-radius:999px;background:var(--primary-soft);
    color:var(--primary);font-size:13px;font-weight:600;margin-bottom:20px;
  }
  .hero-tag .pulse{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hero h1{font-size:clamp(36px,5vw,56px);font-weight:900;line-height:1.1;letter-spacing:-1.5px;margin-bottom:14px}
  .hero h1 .grad{background:var(--primary-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero .role{font-size:20px;color:var(--text-2);font-weight:600;margin-bottom:22px}
  .hero .summary{font-size:15.5px;color:var(--text-2);max-width:560px;margin-bottom:26px;line-height:1.8}
  .hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500;
    background:var(--surface);border:1px solid var(--border);color:var(--text-2);
    transition:all var(--t);
  }
  .badge:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
  .badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:11px 22px;
    border-radius:11px;font-size:14.5px;font-weight:600;transition:all var(--t);
    border:1px solid transparent;
  }
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--primary-grad);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(79,70,229,.4)}
  .btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}

  /* Hero 卡片 */
  .hero-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  }
  .hero-card::before{content:"";position:absolute;top:-50%;right:-50%;width:200px;height:200px;background:var(--primary-grad);filter:blur(60px);opacity:.15;border-radius:50%}
  .avatar{
    width:88px;height:88px;border-radius:24px;background:var(--primary-grad);
    display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800;
    margin-bottom:18px;box-shadow:0 8px 24px rgba(79,70,229,.35);position:relative;
  }
  .hero-card h3{font-size:20px;font-weight:700;margin-bottom:4px}
  .hero-card .sub{font-size:13.5px;color:var(--text-3);margin-bottom:18px}
  .contact-list{display:flex;flex-direction:column;gap:10px}
  .contact-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;
    background:var(--surface-2);border-radius:var(--radius-sm);font-size:14px;
    transition:all var(--t);border:1px solid transparent;
  }
  .contact-item:hover{border-color:var(--primary)}
  .contact-item .ic{width:32px;height:32px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
  .contact-item .ic svg{width:16px;height:16px}
  .contact-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:13px}
  .copy-btn{font-size:11px;color:var(--text-3);padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);transition:all var(--t);flex-shrink:0}
  .copy-btn:hover{color:var(--primary);border-color:var(--primary)}
  .copy-btn.copied{color:#10b981;border-color:#10b981}

  /* ========== 亮点成果 ========== */
  .highlights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 22px;box-shadow:var(--shadow);transition:all var(--t);position:relative;overflow:hidden;
  }
  .stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
  .stat-card .num{font-size:34px;font-weight:900;background:var(--primary-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px}
  .stat-card .num .unit{font-size:18px;font-weight:700}
  .stat-card .label{font-size:13.5px;color:var(--text-2);font-weight:500}
  .stat-card .ic{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;opacity:.6}
  .stat-card .ic svg{width:16px;height:16px}

  /* ========== Tabs 通用 ========== */
  .tabs-bar{display:flex;gap:6px;margin-bottom:26px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
  .tab-btn{
    padding:10px 18px;font-size:14px;font-weight:600;color:var(--text-3);
    border-radius:10px 10px 0 0;position:relative;transition:all var(--t);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn:hover{color:var(--text)}
  .tab-btn[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
  .tab-panel{display:none;animation:fadeInUp .3s ease}
  .tab-panel.active{display:block}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* ========== 经历 时间线 ========== */
  .timeline{position:relative;padding-left:28px}
  .timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--primary),var(--border))}
  .tl-item{position:relative;margin-bottom:28px}
  .tl-item:last-child{margin-bottom:0}
  .tl-item::before{
    content:"";position:absolute;left:-28px;top:6px;width:16px;height:16px;border-radius:50%;
    background:var(--surface);border:3px solid var(--primary);box-shadow:0 0 0 4px var(--primary-soft);
  }
  .tl-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;box-shadow:var(--shadow);transition:all var(--t);
  }
  .tl-card:hover{transform:translateX(4px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
  .tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .tl-title{font-size:16.5px;font-weight:700}
  .tl-org{font-size:13.5px;color:var(--primary);font-weight:600;margin-top:2px}
  .tl-date{
    font-size:12.5px;color:var(--text-3);font-family:var(--mono);font-weight:600;
    background:var(--surface-2);padding:4px 10px;border-radius:7px;white-space:nowrap;
  }
  .tl-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .tl-list li{font-size:14px;color:var(--text-2);padding-left:18px;position:relative;line-height:1.7}
  .tl-list li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .tl-list li b{color:var(--text);font-weight:700}
  .tl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tl-tags .badge{font-size:12px;padding:3px 10px}

  /* ========== 项目卡片 ========== */
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .proj-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow);transition:all var(--t);position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .proj-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
  .proj-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary-grad);transform:scaleX(0);transform-origin:left;transition:transform var(--t)}
  .proj-card:hover::after{transform:scaleX(1)}
  .proj-icon{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:16px}
  .proj-icon svg{width:22px;height:22px}
  .proj-card h4{font-size:17px;font-weight:700;margin-bottom:4px}
  .proj-card .meta{font-size:12.5px;color:var(--text-3);margin-bottom:12px;font-family:var(--mono)}
  .proj-card p{font-size:13.5px;color:var(--text-2);line-height:1.7;flex:1}
  .proj-stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .proj-stack .badge{font-size:11.5px;padding:3px 9px;background:var(--surface-2);border:none}
  .proj-result{
    margin-top:14px;padding:10px 14px;background:var(--accent-soft);border-radius:var(--radius-sm);
    font-size:13px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .proj-result svg{width:15px;height:15px;flex-shrink:0}

  /* ========== 技能矩阵 ========== */
  .skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
  .skill-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
  .skill-group h4{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .skill-group h4 .ic{width:30px;height:30px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
  .skill-group h4 .ic svg{width:15px;height:15px}
  .skill-bars{display:flex;flex-direction:column;gap:13px}
  .skill-bar .sb-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .skill-bar .sb-head .name{font-weight:600;color:var(--text)}
  .skill-bar .sb-head .pct{color:var(--text-3);font-family:var(--mono);font-size:12px}
  .sb-track{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .sb-fill{height:100%;background:var(--primary-grad);border-radius:999px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
  .skill-chips{display:flex;flex-wrap:wrap;gap:7px}
  .skill-chips .chip{
    font-size:12.5px;padding:5px 11px;border-radius:8px;background:var(--surface-2);
    color:var(--text-2);font-weight:500;transition:all var(--t);border:1px solid transparent;
  }
  .skill-chips .chip:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}

  /* ========== 教育 / 证书 ========== */
  .edu-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
  .edu-card,.cert-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow);transition:all var(--t);
  }
  .edu-card:hover,.cert-card:hover{box-shadow:var(--shadow-lg);border-color:var(--primary)}
  .edu-card .school{font-size:18px;font-weight:800;margin-bottom:4px}
  .edu-card .major{font-size:14px;color:var(--primary);font-weight:600;margin-bottom:6px}
  .edu-card .period{font-size:13px;color:var(--text-3);font-family:var(--mono);margin-bottom:14px}
  .edu-meta{display:flex;flex-wrap:wrap;gap:8px}
  .edu-meta .badge{font-size:12.5px}
  .cert-list{display:flex;flex-direction:column;gap:12px}
  .cert-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
  .cert-item:last-child{border-bottom:none}
  .cert-item .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
  .cert-item .ic svg{width:15px;height:15px}
  .cert-item .ct{flex:1}
  .cert-item .ct .t{font-size:14px;font-weight:600}
  .cert-item .ct .d{font-size:12.5px;color:var(--text-3)}

  /* ========== 返回顶部 ========== */
  .to-top{
    position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:14px;
    background:var(--primary-grad);color:#fff;display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(79,70,229,.4);z-index:90;
    opacity:0;visibility:hidden;transform:translateY(20px);transition:all var(--t);
  }
  .to-top.show{opacity:1;visibility:visible;transform:translateY(0)}
  .to-top:hover{transform:translateY(-3px)}
  .to-top svg{width:20px;height:20px}

  /* ========== 页脚 ========== */
  footer{border-top:1px solid var(--border);padding:36px 0;margin-top:40px;background:var(--bg-2)}
  footer .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  footer .copy{font-size:13.5px;color:var(--text-3)}
  footer .copy b{color:var(--text-2)}
  footer .updated{font-size:12.5px;color:var(--text-3);font-family:var(--mono)}

  /* ========== 动画 / 进入 ========== */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:translateY(0)}
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
    html{scroll-behavior:auto}
  }

  /* ========== 响应式 ========== */
  @media(max-width:880px){
    .hero-grid{grid-template-columns:1fr;gap:32px}
    .edu-grid{grid-template-columns:1fr}
    .nav-links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--surface);flex-direction:column;padding:12px;border-bottom:1px solid var(--border);box-shadow:var(--shadow-lg)}
    .nav-links.open{display:flex}
    .nav-links a{padding:12px 16px}
    .menu-toggle{display:grid}
    section{padding:56px 0}
    .hero{padding:100px 0 48px}
    .section-head h2{font-size:24px}
  }
  @media(max-width:560px){
    .wrap{padding:0 18px}
    .hero h1{font-size:34px}
    .hero .role{font-size:17px}
    .stat-card .num{font-size:28px}
    .proj-grid{grid-template-columns:1fr}
  }

  /* ========== 打印样式 ========== */
  @media print{
    body{background:#fff;color:#000;font-size:11pt}
    body::before{display:none}
    nav.topbar,.to-top,.hero-cta,.copy-btn,.menu-toggle,.nav-actions,.tabs-bar{display:none!important}
    section{padding:14px 0;page-break-inside:avoid}
    .hero{padding:0 0 10px}
    .hero-card,.stat-card,.tl-card,.proj-card,.skill-group,.edu-card,.cert-card{
      box-shadow:none;border:1px solid #ccc;break-inside:avoid;
    }
    .tab-panel{display:block!important}
    .badge,.skill-chips .chip{border:1px solid #ccc;background:#f5f5f5}
    .hero h1 .grad,.stat-card .num{-webkit-text-fill-color:#1a1a1a;color:#1a1a1a}
    .tl-list li::before,.tl-item::before{background:#444;border-color:#444;box-shadow:none}
    .sb-fill{background:#444!important}
    .reveal{opacity:1;transform:none}

/* ========== 状态 ========== */
let curLang = "zh";
const phone = "+86 15018865389";
// 邮箱防爬虫：分段存储
const emailParts = ["663225787","@","qq",".","com"];
let emailRevealed = false;

/* ========== 工具函数 ========== */
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const el = (tag,cls="",html="")=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;};

/* ========== 应用 i18n 文本 ========== */
function applyI18n(){
  const d = resume[curLang];
  document.documentElement.lang = curLang==="zh"?"zh-CN":"en";
  // data-i18n
  $$("[data-i18n]").forEach(n=>{
    const k=n.getAttribute("data-i18n");
    if(d.i18n[k]) n.textContent=d.i18n[k];
  });
  // 名称
  $("#navName").textContent = d.navName;
  $("#heroName").innerHTML = `${d.name}<br><span class="grad">${d.i18n.heroTitle}</span>`;
  $("#cardName").textContent = d.name;
  $("#avatarText").textContent = d.avatar;
  $("#footerName").textContent = d.footerName;
  $("#phoneText").textContent = phone;
  $("#emailText").textContent = d.i18n.emailHint;
  $("#emailCopy").textContent = d.i18n.copy;
  emailRevealed = false;
  // lang button
  $("#langBtn").textContent = curLang==="zh"?"EN":"中";
  // 渲染各模块
  renderHeroBadges();
  renderHighlights();
  renderExperience();
  renderProjects();
  renderSkills();
  renderEducation();
}

/* ========== 渲染：Hero 徽章 ========== */
function renderHeroBadges(){
  const d = resume[curLang];
  const box = $("#heroBadges");
  box.innerHTML = "";
  d.heroBadges.forEach((b,i)=>{
    const span = el("span", i%3===2?"badge accent":"badge", b);
    box.appendChild(span);
  });
}

/* ========== 渲染：亮点 ========== */
function renderHighlights(){
  const d = resume[curLang];
  const grid = $("#highlightsGrid");
  grid.innerHTML = "";
  d.highlights.forEach(h=>{
    const card = el("div","stat-card reveal");
    card.innerHTML = `
      <div class="ic">${icons[h.icon]||""}</div>
      <div class="num">${h.num}<span class="unit">${h.unit||""}</span></div>
      <div class="label">${h.label}</div>`;
    grid.appendChild(card);
  });
  observeReveal();
}

/* ========== 渲染：经历 Tabs ========== */
function renderExperience(){
  const d = resume[curLang];
  const cats = [
    {key:"all",label:d.i18n.tabAll},
    {key:"union",label:d.i18n.tabUnion},
    {key:"club",label:d.i18n.tabClub},
    {key:"class",label:d.i18n.tabClass}
  ];
  const bar = $("#expTabs");
  bar.innerHTML = "";
  const panels = $("#expPanels");
  panels.innerHTML = "";
  cats.forEach((c,i)=>{
    const btn = el("button","tab-btn",c.label);
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected",i===0?"true":"false");
    btn.setAttribute("data-cat",c.key);
    btn.id = `exp-tab-${c.key}`;
    btn.addEventListener("click",()=>switchTab("exp",c.key));
    bar.appendChild(btn);
    const panel = el("div","tab-panel");
    panel.setAttribute("role","tabpanel");
    panel.setAttribute("aria-labelledby",btn.id);
    panel.id = `exp-panel-${c.key}`;
    if(i===0) panel.classList.add("active");
    const tl = el("div","timeline");
    d.experience.filter(e=>c.key==="all"||e.cat===c.key).forEach(e=>{
      const item = el("div","tl-item");
      item.innerHTML = `
        <div class="tl-card reveal">
          <div class="tl-head">
            <div>
              <div class="tl-title">${e.title}</div>
              <div class="tl-org">${e.org}</div>
            </div>
            <div class="tl-date">${e.date}</div>
          </div>
          <ul class="tl-list">${e.points.map(p=>`<li>${p}</li>`).join("")}</ul>
          <div class="tl-tags">${e.tags.map(t=>`<span class="badge">${t}</span>`).join("")}</div>
        </div>`;
      tl.appendChild(item);
    });
    panel.appendChild(tl);
    panels.appendChild(panel);
  });
  observeReveal();
}

/* ========== 渲染：项目 Tabs ========== */
function renderProjects(){
  const d = resume[curLang];
  const cats = [
    {key:"event",label:d.i18n.tabProjEvent},
    {key:"org",label:d.i18n.tabProjOrg},
    {key:"class",label:d.i18n.tabProjClass}
  ];
  const bar = $("#projTabs");
  bar.innerHTML = "";
  const panels = $("#projPanels");
  panels.innerHTML = "";
  // “全部” 标签
  const allBtn = el("button","tab-btn",d.i18n.tabAll);
  allBtn.setAttribute("role","tab");
  allBtn.setAttribute("aria-selected","true");
  allBtn.setAttribute("data-cat","all");
  allBtn.id="proj-tab-all";
  allBtn.addEventListener("click",()=>switchTab("proj","all"));
  bar.appendChild(allBtn);
  const allPanel = el("div","tab-panel active");
  allPanel.setAttribute("role","tabpanel");
  allPanel.setAttribute("aria-labelledby",allBtn.id);
  allPanel.id="proj-panel-all";
  allPanel.appendChild(buildProjGrid(d.projects));
  panels.appendChild(allPanel);

  cats.forEach(c=>{
    const btn = el("button","tab-btn",c.label);
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected","false");
    btn.setAttribute("data-cat",c.key);
    btn.id=`proj-tab-${c.key}`;
    btn.addEventListener("click",()=>switchTab("proj",c.key));
    bar.appendChild(btn);
    const panel = el("div","tab-panel");
    panel.setAttribute("role","tabpanel");
    panel.setAttribute("aria-labelledby",btn.id);
    panel.id=`proj-panel-${c.key}`;
    const items = d.projects.filter(p=>p.cat===c.key);
    panel.appendChild(buildProjGrid(items));
    panels.appendChild(panel);
  });
  observeReveal();
}
function buildProjGrid(items){
  const grid = el("div","proj-grid");
  items.forEach(p=>{
    const card = el("div","proj-card reveal");
    card.innerHTML = `
      <div class="proj-icon">${icons.briefcase}</div>
      <h4>${p.title}</h4>
      <div class="meta">${p.meta}</div>
      <p>${p.desc}</p>
      <div class="proj-stack">${p.stack.map(s=>`<span class="badge">${s}</span>`).join("")}</div>
      <div class="proj-result">${icons.star}<span>${p.result}</span></div>`;
    grid.appendChild(card);
  });
  return grid;
}

/* ========== 渲染：技能 ========== */
function renderSkills(){
  const d = resume[curLang];
  const grid = $("#skillsGrid");
  grid.innerHTML = "";
  d.skills.forEach(g=>{
    const group = el("div","skill-group reveal");
    let inner = `<h4><span class="ic">${icons[g.icon]||""}</span>${g.title}</h4>`;
    if(g.items){
      inner += `<div class="skill-bars">`;
      g.items.forEach(it=>{
        inner += `<div class="skill-bar">
          <div class="sb-head"><span class="name">${it.name}</span><span class="pct">${it.level}%</span></div>
          <div class="sb-track"><div class="sb-fill" data-level="${it.level}"></div></div>
        </div>`;
      });
      inner += `</div>`;
    } else if(g.chips){
      inner += `<div class="skill-chips">${g.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>`;
    }
    group.innerHTML = inner;
    grid.appendChild(group);
  });
  observeReveal();

  setTimeout(()=>{
    $$(".sb-fill").forEach(f=>{
      const lv = f.getAttribute("data-level");
      f.style.width = lv + "%";
    });
  },200);
}

/* ========== 渲染：教育 / 证书 ========== */
function renderEducation(){
  const d = resume[curLang];

    <div class="school">${edu.school}</div>

/* ========== Tab 切换 ========== */
function switchTab(prefix,cat){
  const bar = $(`#${prefix}Tabs`);
  $$("button",bar).forEach(b=>{
    const sel = b.getAttribute("data-cat")===cat;
    b.setAttribute("aria-selected",sel?"true":"false");
  });
  $(`#${prefix}Panels`).querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  const panel = $(`#${prefix}-panel-${cat}`);
  if(panel) panel.classList.add("active");
  observeReveal();
  // 重新触发进度条
  if(prefix==="proj"||prefix==="exp"){}
  if(prefix==="skills"){}
}

/* ========== Tab 键盘支持 ========== */
function setupTabKeyboard(){
  ["#expTabs","#projTabs"].forEach(sel=>{
    const bar = $(sel);
    bar.addEventListener("keydown",e=>{
      const btns = $$('button[role="tab"]',bar);
      const idx = btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
      if(e.key==="ArrowRight"||e.key==="ArrowDown"){
        e.preventDefault();
        const ni = (idx+1)%btns.length;
        btns[ni].focus();
        btns[ni].click();
      } else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){
        e.preventDefault();
        const ni = (idx-1+btns.length)%btns.length;
        btns[ni].focus();
        btns[ni].click();
      } else if(e.key==="Home"){
        e.preventDefault();btns[0].focus();btns[0].click();
      } else if(e.key==="End"){
        e.preventDefault();btns[btns.length-1].focus();btns[btns.length-1].click();
      }
    });
  });
}

/* ========== 主题切换 ========== */
function setupTheme(){
  const saved = localStorage.getItem("theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
  const theme = saved || (prefersDark?"dark":"light");
  setTheme(theme);
  $("#themeBtn").addEventListener("click",()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    setTheme(cur==="dark"?"light":"dark");
  });
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  localStorage.setItem("theme",t);
  $("#iconMoon").style.display = t==="dark"?"none":"block";
  $("#iconSun").style.display = t==="dark"?"block":"none";
}

/* ========== 语言切换 ========== */
function setupLang(){
  $("#langBtn").addEventListener("click",()=>{
    curLang = curLang==="zh"?"en":"zh";
    localStorage.setItem("lang",curLang);
    applyI18n();
  });
  const saved = localStorage.getItem("lang");
  if(saved) curLang = saved;
}

/* ========== 邮箱防爬虫 ========== */
function setupEmail(){
  const txt = $("#emailText");
  const btn = $("#emailCopy");
  txt.style.cursor = "pointer";
  txt.addEventListener("click",revealEmail);
  btn.addEventListener("click",e=>{
    e.stopPropagation();
    revealEmail();
    copyEmail();
  });
}
function revealEmail(){
  if(emailRevealed) return;
  const email = emailParts.join("");
  $("#emailText").textContent = email;
  emailRevealed = true;
}
function copyEmail(){
  const email = emailParts.join("");
  const btn = $("#emailCopy");
  if(navigator.clipboard){
    navigator.clipboard.writeText(email).then(()=>{
      btn.textContent = resume[curLang].i18n.copied;
      btn.classList.add("copied");
      setTimeout(()=>{
        btn.textContent = resume[curLang].i18n.copy;
        btn.classList.remove("copied");
      },1800);
    });
  } else {
    // 后备方案
    const ta = document.createElement("textarea");
    ta.value = email;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");btn.textContent=resume[curLang].i18n.copied;btn.classList.add("copied");setTimeout(()=>{btn.textContent=resume[curLang].i18n.copy;btn.classList.remove("copied");},1800);}catch(e){}
    document.body.removeChild(ta);
  }
}

/* ========== 平滑滚动 / 返回顶部 ========== */
function setupScroll(){
  const toTop = $("#toTop");
  window.addEventListener("scroll",()=>{
    if(window.scrollY > 400) toTop.classList.add("show");
    else toTop.classList.remove("show");
  },{passive:true});
  toTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
  // 移动端菜单
  $("#menuToggle").addEventListener("click",()=>{
    $("#navLinks").classList.toggle("open");
  });
  // 点击导航链接后关闭菜单
  $$("#navLinks a").forEach(a=>{
    a.addEventListener("click",()=>$("#navLinks").classList.remove("open"));
  });
}

/* ========== 打印 ========== */
function setupPrint(){
  $("#printBtn").addEventListener("click",()=>{
    // 打印时展开所有 Tab
    $$(".tab-panel").forEach(p=>p.classList.add("active"));
    $$(".sb-fill").forEach(f=>{f.style.width=f.getAttribute("data-level")+"%";});
    setTimeout(()=>window.print(),100);
  });
}

/* ========== 进入动画 IntersectionObserver ========== */
let io;
function observeReveal(){
  if(!io){
    io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add("in");
          io.unobserve(e.target);
        }
      });
    },{threshold:0.1,rootMargin:"0px 0px -40px 0px"});
  }
  $$(".reveal:not(.in)").forEach(e=>io.observe(e));
}

/* ========== 初始化 ========== */
function init(){
  setupLang();
  setupTheme();
  applyI18n();
  setupTabKeyboard();
  setupEmail();
  setupScroll();
  setupPrint();
  // 更新时间
  const now = new Date();
  const t = resume[curLang];
  const stamp = curLang==="zh"
    ? `更新于 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`
    : `Updated ${now.toLocaleDateString("en-US")}`;
  $("#updated").textContent = stamp;
}
init();
</script>
