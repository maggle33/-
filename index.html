<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课程与日程提醒</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#185FA5">
<meta name="description" content="大学生课程表与日程提醒，数据保存在本机，可导出到手机系统日历">
<!-- iOS 主屏幕安装：只有加了 apple-mobile-web-app-capable，Safari 从主屏幕启动时才没有地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- default 让状态栏白底黑字，和应用的浅色主题一致；黑色字在浅色界面上更清楚 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课程提醒">
<!-- 显示在 iOS 分享等系统位置的应用名 -->
<meta name="application-name" content="课程提醒">
<!-- 禁止 iOS 把纯数字内容识别成电话号码后自动变成蓝色链接 -->
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<!-- 主屏幕图标：180 是 iPhone 的标准尺寸，512 供 iPad 与更高分屏使用 -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="today">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"/>
        <path d="M3 10h18M8 3v4M16 3v4"/>
        <path d="M8.6 14.6l2.2 2.2 4.4-4.4"/>
      </svg>
      <span>今日</span>
    </button>
    <button class="tab" data-tab="timetable">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="3"/>
        <path d="M3 9.5h18M3 15h18M9 4v16M15 4v16"/>
      </svg>
      <span>课表</span>
    </button>
    <button class="tab" data-tab="schedule">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/>
        <circle cx="4.8" cy="6.5" r="1.4"/>
        <circle cx="4.8" cy="12" r="1.4"/>
        <circle cx="4.8" cy="17.5" r="1.4"/>
      </svg>
      <span>日程</span>
    </button>
    <button class="tab" data-tab="countdown">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9.5V13l2.6 1.6"/>
        <path d="M9 3h6"/>
      </svg>
      <span>计划</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7.5h9M18.5 7.5H20M4 16.5h1.5M11 16.5h9"/>
        <circle cx="15.8" cy="7.5" r="2.4"/>
        <circle cx="8.2" cy="16.5" r="2.4"/>
      </svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div class="panel" id="panel"></div>
<div class="mask" id="maskRoot"></div>
<div id="sheetRoot"></div>
<!-- modalRoot 不能带 .mask：.mask 是 display:none，容器一藏，插进来的对话框和提醒弹窗就永远看不见 -->
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/date.js"></script>
<script src="js/periods.js"></script>
<script src="js/store.js"></script>
<script src="js/schedule.js"></script>
<script src="js/reminder.js"></script>
<script src="js/ics.js"></script>
<script src="js/plan.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<!-- 安卓壳（打包成 APK 时）的适配层；在普通浏览器里这个文件什么都不做 -->
<script src="js/android.js"></script>
<!-- iOS（PWA）适配层；非 iOS 环境下这个文件什么都不做 -->
<script src="js/ios.js"></script>
<script>
// 离线可用：注册 Service Worker。
//
// 安卓壳里**故意不注册**：壳的页面来自包内的本地服务器，本来就离线可用，
// Service Worker 在这里不但没用，还会让覆盖安装后继续吃上一版的旧缓存
// （安卓更新应用不会清 WebView 数据），出现「明明改了却没生效」。
// 已经注册过的老实例由 js/android.js 在启动时注销掉。
//
// iOS 版恰恰相反：Service Worker **必须**注册——它既提供离线能力，
// 也是 PWA 被判定为「可安装」的必要条件之一。
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !window.Android) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
